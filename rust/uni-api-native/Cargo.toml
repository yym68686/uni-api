[package]
name = "uni-api-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"

[lib]
name = "_uni_api_native"
crate-type = ["cdylib"]

[dependencies]
# Exact versions keep the production Rust 1.84 toolchain reproducible. The
# resolver config selects only transitive releases whose declared MSRV fits.
axum = "=0.8.4"
base64 = "=0.22.1"
bytes = "=1.10.1"
futures-util = "=0.3.31"
hyper-rustls = { version = "=0.27.7", default-features = false, features = ["http1", "ring", "tls12", "webpki-roots"] }
memchr = "2.7.4"
pyo3 = { version = "0.28.3", features = ["extension-module"] }
reqwest = { version = "=0.12.22", default-features = false, features = ["json", "rustls-tls-webpki-roots", "socks", "stream"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.142"
sha2 = "=0.10.9"
tokio = { version = "=1.47.1", features = ["macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "=0.1.17"
tokio-util = "=0.7.16"
url = "=2.5.4"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"
